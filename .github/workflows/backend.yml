name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Pushes backend/ to the Hugging Face Space after tests pass on main.
  # Setup: repo secret HF_TOKEN (write token) + repo variable HF_SPACE (e.g. ftmakyldz/smartwardrobe-api).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Upload backend to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder
          upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="backend",
              token=os.environ["HF_TOKEN"],
              ignore_patterns=[".venv/**", "**/__pycache__/**", "*.db", ".env", "tests/**", "scripts/**", "requirements-dev.txt"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
          )
          PY
