name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG: postgresql://postgres:postgres@localhost:5432
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: psql "$PG/postgres" -c "CREATE DATABASE sw_test" -c "CREATE DATABASE sw_migrate"
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/sw_test
      - name: Migrations on Postgres — upgrade, check, down, up, check
        env:
          DATABASE_URL: ${{ env.PG }}/sw_migrate
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
          alembic check

  # Pushes backend/ to the Hugging Face Space after tests pass on main.
  # Setup: repo secret HF_TOKEN (write token) + repo variable HF_SPACE (e.g. ftmakyldz/smartwardrobe-api).
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Upload backend to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder
          upload_folder(
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              folder_path="backend",
              token=os.environ["HF_TOKEN"],
              ignore_patterns=[".venv/**", "**/__pycache__/**", "*.db", ".env", "tests/**", "scripts/**", "requirements-dev.txt"],
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
          )
          PY
